<!doctype html>
<!-- The game in a phone, on a desktop: real screen sizes, the notch / Dynamic Island drawn over
     the screen, and the phone's SAFE AREAS pushed into the game (style.css reads them from
     --sa-l/r/t/b, which env() leaves at 0 on a desktop). Open http://localhost:3020/phone.html
     (?dev=max&url=/?play=1 to start somewhere else). The on-screen buttons take the mouse, one
     at a time; for a real match use the keyboard — arrows / A D, ↑ or Space, ↓ or S, J. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #14161c; --panel: #1e222b; --ink: #e8ecf3; --dim: #8d96a8; --acc: #ffc021; --edge: #3a3f4a; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.4 -apple-system, "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #ffffff14; }
  select, button, input { font: inherit; color: var(--ink); background: #2a2f3a; border: 1px solid #ffffff22;
    border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: #ffffff55; }
  button.main { background: var(--acc); color: #221600; border: 0; font-weight: 700; }
  label { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  input[type=text] { width: 220px; }
  .sep { width: 1px; height: 24px; background: #ffffff1a; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .phone { position: relative; flex: none; padding: 14px; border-radius: 60px; background: #0a0a0c;
    box-shadow: 0 0 0 2px var(--edge), 0 0 0 5px #17181b, 0 30px 80px #000c; transform-origin: center; }
  .screen { position: relative; overflow: hidden; background: #000; }
  iframe { display: block; border: 0; background: #000; }
  /* the hardware drawn OVER the screen, where the phone really has it */
  .cut { position: absolute; background: #000; z-index: 2; pointer-events: none; }
  .home { position: absolute; z-index: 2; pointer-events: none; border-radius: 3px; background: #fff9; }
  .keys { position: absolute; background: #2c2e33; border-radius: 3px; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 6px 16px 10px; }
  kbd { background: #2a2f3a; border: 1px solid #ffffff22; border-radius: 4px; padding: 0 5px; font: 11px/1.6 ui-monospace, monospace; color: var(--ink); }
</style>
</head>
<body>
<header>
  <label>Phone <select id="dev"></select></label>
  <button id="rot" title="Rotate">⟳ Rotate</button>
  <label><input type="checkbox" id="fit" checked> Fit</label>
  <label><input type="checkbox" id="safe" checked> Safe areas</label>
  <span class="sep"></span>
  <button data-go="/">Menu</button>
  <button data-go="/?play=1">Play</button>
  <button data-go="/?play=1&solo=1">Practice (no bot)</button>
  <span class="sep"></span>
  <label>Link <input type="text" id="url" value="/"></label>
  <button class="main" id="go">Load</button>
</header>
<main><div class="phone" id="phone"><div class="screen" id="screen"><iframe id="frame" title="game" allow="autoplay; fullscreen"></iframe></div></div></main>
<footer id="info"></footer>
<script>
  // w×h: the LANDSCAPE screen in CSS px. sa: safe-area insets in landscape [side, bottom] (the
  // notch side gets `side`; iOS reserves it on both sides). cut: 'island' | 'notch' | 'hole' | ''.
  const DEVICES = {
    '14':    { name: 'iPhone 13 / 14', w: 844, h: 390, r: 47, sa: [47, 21], cut: 'notch' },
    '15':    { name: 'iPhone 15 / 16', w: 852, h: 393, r: 55, sa: [59, 21], cut: 'island' },
    max:     { name: 'iPhone 15 Pro Max', w: 932, h: 430, r: 55, sa: [59, 21], cut: 'island' },
    se:      { name: 'iPhone SE', w: 667, h: 375, r: 0, sa: [0, 0], cut: '' },
    android: { name: 'Android large (Pixel)', w: 915, h: 412, r: 34, sa: [28, 0], cut: 'hole' },
    small:   { name: 'Android small', w: 800, h: 360, r: 24, sa: [24, 0], cut: 'hole' },
  };
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  for (const [k, d] of Object.entries(DEVICES)) $('dev').add(new Option(`${d.name} (${d.w}×${d.h})`, k));
  $('dev').value = DEVICES[q.get('dev')] ? q.get('dev') : '14';
  if (q.get('url')) $('url').value = q.get('url');
  let portrait = q.get('rot') === 'port';

  const dev = () => DEVICES[$('dev').value];
  function frame() {
    const d = dev(), f = $('frame'), s = $('screen'), ph = $('phone');
    const w = portrait ? d.h : d.w, h = portrait ? d.w : d.h;
    f.style.width = w + 'px'; f.style.height = h + 'px';
    s.style.borderRadius = d.r + 'px';
    ph.style.borderRadius = (d.r ? d.r + 13 : 36) + 'px';
    ph.style.padding = d.r ? '14px' : (portrait ? '64px 14px' : '14px 64px');
    // the hardware: notch / island / camera hole on the top edge in portrait, the left edge in landscape
    ph.querySelectorAll('.cut, .home, .keys').forEach((e) => e.remove());
    const add = (cls, css) => { const e = document.createElement('div'); e.className = cls; Object.assign(e.style, css); (cls === 'keys' ? ph : s).appendChild(e); };
    const along = (len, thick, off, extra = {}) => portrait
      ? { left: `calc(50% - ${len / 2}px)`, top: off + 'px', width: len + 'px', height: thick + 'px', ...extra }
      : { top: `calc(50% - ${len / 2}px)`, left: off + 'px', width: thick + 'px', height: len + 'px', ...extra };
    if (d.cut === 'island') add('cut', along(124, 36, 11, { borderRadius: '18px' }));
    if (d.cut === 'notch') add('cut', along(160, 32, 0, { borderRadius: portrait ? '0 0 20px 20px' : '0 20px 20px 0' }));
    if (d.cut === 'hole') add('cut', along(12, 12, 10, { borderRadius: '50%' }));
    if (d.r) add('home', portrait ? { bottom: '8px', left: 'calc(50% - 67px)', width: '134px', height: '5px' }
                                  : { bottom: '7px', left: 'calc(50% - 90px)', width: '180px', height: '5px' });
    // side keys on the phone's body
    if (portrait) { add('keys', { left: '-5px', top: '120px', width: '4px', height: '60px' }); add('keys', { right: '-5px', top: '150px', width: '4px', height: '90px' }); }
    else { add('keys', { top: '-5px', left: '120px', width: '60px', height: '4px' }); add('keys', { bottom: '-5px', left: '150px', width: '90px', height: '4px' }); }
    fit(); safeAreas();
  }
  function fit() {
    const d = dev(), ph = $('phone'), m = document.querySelector('main').getBoundingClientRect();
    const r = ph.getBoundingClientRect(), w = ph.offsetWidth, h = ph.offsetHeight;
    const k = $('fit').checked ? Math.min(1.6, (m.width - 40) / w, (m.height - 30) / h) : 1;
    ph.style.transform = `scale(${k})`;
    const sw = portrait ? d.h : d.w, sh = portrait ? d.w : d.h;
    $('info').innerHTML = `${d.name} — ${sw}×${sh} CSS px at ${Math.round(k * 100)}%. ` +
      `Keys: <kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> move · <kbd>↑</kbd>/<kbd>Space</kbd> jump · <kbd>↓</kbd>/<kbd>S</kbd> kick · <kbd>J</kbd> power · <kbd>Esc</kbd> pause. ` +
      `The on-screen buttons take the mouse (one at a time).`;
  }
  // The phone's safe areas, into the game: style.css mirrors env(safe-area-inset-*) into --sa-*,
  // and a desktop's env() is 0 — set on the iframe's <html> they win over the :root rule.
  function safeAreas() {
    let doc; try { doc = $('frame').contentDocument; } catch { return; }
    if (!doc || !doc.documentElement) return;
    const d = dev(), on = $('safe').checked, st = doc.documentElement.style;
    const [side, bottom] = on ? d.sa : [0, 0];
    const v = portrait ? { t: side, b: bottom ? 34 : 0, l: 0, r: 0 } : { l: side, r: side, b: bottom, t: 0 };
    for (const k of ['l', 'r', 't', 'b']) st.setProperty(`--sa-${k}`, v[k] + 'px');
    doc.defaultView && doc.defaultView.dispatchEvent(new Event('resize'));
  }
  function load(url) {
    if (url) $('url').value = url;
    const u = $('url').value || '/';
    $('frame').src = u + (u.includes('?') ? '&' : '?') + 'v=' + Date.now();
    frame();
  }
  $('frame').addEventListener('load', () => { safeAreas(); setTimeout(safeAreas, 300); $('frame').focus(); });
  $('dev').onchange = frame; $('fit').onchange = fit; $('safe').onchange = safeAreas;
  $('rot').onclick = () => { portrait = !portrait; frame(); };
  $('go').onclick = () => load();
  $('url').onkeydown = (e) => { if (e.key === 'Enter') load(); };
  document.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => load(b.dataset.go)));
  // keys pressed on the simulator page itself go to the game
  addEventListener('keydown', (e) => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') $('frame').focus(); }, true);
  addEventListener('resize', fit);
  load();
</script>
</body>
</html>

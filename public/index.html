<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="img/saltiz-sm.jpg">
<link rel="apple-touch-icon" href="img/saltiz-sm.jpg">
<!-- HS is landscape-only and fullscreen (HS-GAP-AUDIT U10/U14) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap">
<title>סלטיז ראשים · Head Soccer mock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ PICK ═══ choose a card for each head ══════════════════════════════ -->
<section id="pick" class="screen">
  <div class="pick-top">
  <header class="pick-head">
    <h1>סלטיז <span>ראשים</span></h1>
    <p class="sub">בחר את הקלף שיילחם בשבילך</p>
    <b class="netdot" id="netdot" title="חיבור"></b>
  </header>

  <div class="slots">
    <button class="slot" id="slotMe"  data-who="me">
      <div class="slot-art"></div>
      <div class="slot-cap">אני</div>
      <div class="slot-shot">—</div>
    </button>
    <div class="vs">VS</div>
    <button class="slot" id="slotFoe" data-who="foe">
      <div class="slot-art"></div>
      <div class="slot-cap">יריב</div>
      <div class="slot-shot">—</div>
    </button>
  </div>

  <nav class="rarity-tabs" id="rarityTabs">
    <button data-r="legendary" class="on">אגדי</button>
    <button data-r="epic">אדיר</button>
    <button data-r="rare">נדיר</button>
    <button data-r="common">רגיל</button>
  </nav>
  </div>

  <div class="grid" id="cardGrid"></div>

  <!-- One way forward from the album: «שחק». HOW to play is the next screen's question —
       it used to be a two-way toggle down here, and the game now has two different answers
       to it (a friend, or the 45-champion arcade), each with its own screen behind it. -->
  <div class="pick-bar">
  <footer class="pick-foot">
    <span class="pick-hint">בחר קלף ולחץ שחק</span>
    <button class="play" id="playBtn">שחק</button>
  </footer>
  </div>
</section>

<!-- ═══ MODE ═══ the card is chosen: who do you play? ════════════════════ -->
<!-- .salt = the Saltiz look: the red-and-yellow hexagon, its rays and its hex floor. -->
<section id="modeSel" class="screen hidden salt">
  <i class="salt-rays" aria-hidden="true"></i>
  <button class="salt-back" id="modeBack">‹ חזרה</button>
  <header class="mode-brand">
    <span class="salt-logo"><img src="img/saltiz-sm.jpg" alt="סלטיז"></span>
    <div>
      <span class="salt-kicker">סלטיז ראשים</span>
      <h2 class="salt-h">בחר מצב משחק</h2>
    </div>
  </header>
  <div class="mode-cards">
    <button class="mode-card red" id="modeMulti">
      <span class="mode-hex"><i>👥</i></span>
      <b>רב משתתפים</b>
      <span class="mode-sub">1 על 1 עם חבר · קישור או קוד</span>
      <em class="mode-tag">🔥 אונליין</em>
    </button>
    <button class="mode-card gold" id="modeArcade">
      <span class="mode-hex"><i>🏆</i></span>
      <b>שחקן יחיד</b>
      <span class="mode-sub" id="modeArcadeSub">45 אלופים · שלב 1</span>
      <em class="mode-tag">⭐ ארקייד</em>
    </button>
  </div>
  <!-- Multiplayer is the existing private-room flow, unchanged: the same two buttons, the
       same lobby behind them. -->
  <div class="multi-row hidden" id="multiRow">
    <button class="play" id="hostBtn">🔗 צור קישור</button>
    <button class="ghost" id="joinBtn">הצטרף לקוד</button>
  </div>
</section>

<!-- ═══ ARCADE ═══ 45 champions, beaten in order ═════════════════════════ -->
<!-- Laid out like Head Soccer's PLAYER SELECT: you on one side, the champion on the other,
     VS between, the 45 champions as a strip underneath, the stats and PLAY along the bottom. -->
<section id="arcade" class="screen hidden salt">
  <i class="salt-rays" aria-hidden="true"></i>
  <header class="arc-head">
    <button class="salt-back" id="arcBack">‹ חזרה</button>
    <div class="arc-brand">
      <h2 class="salt-h">בחר אלוף</h2>
    </div>
    <div class="arc-prog"><span>🏆</span><div class="arc-bar"><i id="arcBar"></i></div><b id="arcProg">0 / 45</b></div>
  </header>

  <div class="arc-pitch">
    <div class="arc-side you">
      <span class="arc-tag">אתה</span>
      <div class="hexframe"><i class="arc-you-face" id="arcYouFace"></i></div>
      <b class="arc-name" id="arcYou">—</b>
    </div>

    <div class="arc-mid">
      <span class="salt-logo arc-logo"><img src="img/saltiz-sm.jpg" alt="סלטיז"></span>
      <span class="arc-stage" id="arcStage">שלב 1</span>
      <div class="arc-vs">VS</div>
      <span class="arc-stars" id="arcStars"></span>
      <span class="arc-status" id="arcStatus"></span>
      <div class="arc-power"><b id="arcPower">—</b><p id="arcDesc">—</p></div>
    </div>

    <div class="arc-side foe">
      <span class="arc-tag">אלוף</span>
      <!-- The reel, Head Soccer style: the champions stacked vertically, the chosen one big in
           the middle, the ones before and after shrinking away above and below. ▲/▼, the
           arrow keys, the wheel, a drag or a tap on a neighbour all roll it. -->
      <button class="arc-step up" id="arcPrev" aria-label="הקודם">▲</button>
      <div class="arc-reel" id="arcReel" role="group" aria-roledescription="carousel" aria-label="אלופים"></div>
      <button class="arc-step down" id="arcNext" aria-label="הבא">▼</button>
      <b class="arc-name arc-title" id="arcTitle" aria-live="polite">—</b>
      <span class="arc-count" id="arcCount">1 / 45</span>
    </div>

    <div class="arc-grid" id="arcGrid"></div>
  </div>

  <footer class="arc-foot">
    <div class="arc-free">
      <button class="salt-btn red" id="freeBtn">אימון חופשי</button>
      <!-- The old «נגד המחשב» match, kept: your card against the יריב slot at a chosen level. -->
      <label class="diff">
        <span>רמה</span>
        <input type="range" id="diff" min="0" max="5" step="1" value="3">
        <b id="diffName">קשה</b>
      </label>
    </div>
    <div class="arc-stats" id="arcStats"></div>
    <button class="salt-btn gold" id="arcPlay">שחק</button>
  </footer>
</section>

<!-- ═══ LOBBY ═══ private room, joined by a 4-char code ═══════════════════ -->
<section id="lobby" class="screen hidden">
  <button class="lobby-back" id="lobbyBack">‹ חזרה</button>
  <h2>חדר פרטי</h2>

  <div class="code-box" id="codeBox">
    <span class="code-label">הקוד שלך</span>
    <b id="roomCode">····</b>
    <button class="ghost" id="copyLink">העתק קישור</button>
  </div>

  <div class="join-box" id="joinBox">
    <span class="code-label">הכנס קוד חבר</span>
    <input id="codeInput" maxlength="4" inputmode="latin" autocapitalize="characters" placeholder="ABCD">
    <button class="ghost" id="joinGo">הצטרף</button>
  </div>

  <div class="seats" id="seats"></div>
  <p class="lobby-hint" id="lobbyHint">שלח את הקישור לחבר</p>
  <button class="play" id="readyBtn" disabled>מוכן</button>
</section>

<!-- ═══ MATCH ═══════════════════════════════════════════════════════════ -->
<section id="match" class="screen hidden">
  <div id="stage">
    <canvas id="cv"></canvas>
    <!-- HS's gold KICK OFF / GOAL! lettering, HD, above the pitch (drawReady) -->
    <div class="hsb" id="hsb" aria-hidden="true"></div>
    <!-- The characters' bodies and boots, full resolution (body-art.js), under the cut-in's dark and the heads. -->
    <canvas id="cvbody" class="fx"></canvas>
    <!-- Power-shot light UNDER the heads, full resolution (champ-vfx.js drawUnder: the cut-in). -->
    <canvas id="cvfx0" class="fx"></canvas>
    <!-- Heads are DOM, never canvas-blitted: card art drawn into a canvas comes out
         blank in WKWebView, so the one thing that MUST survive the app is an <img>/CSS layer. -->
    <div class="head" id="head0"><i></i></div>
    <div class="head" id="head1"><i></i></div>
    <!-- The near net, and only the near net, over the heads. A head is DOM and the canvas
         below can never draw on one, so a player standing INSIDE the goal would have their
         body behind the net and their face in front of it. See drawHeadNet in game.js. -->
    <canvas id="cvnet"></canvas>
    <!-- Power-shot light OVER the heads, full resolution (champ-vfx.js drawTop). -->
    <canvas id="cvfx1" class="fx"></canvas>

         the clock between them and a little above both. The old row put both scores and the
         clock on one baseline inside a black box, which reads as a widget sitting on the
         picture; stacked and unboxed, the pitch shows through and the two numbers you are
         actually comparing sit one under its own face. The portraits are the same card crop
         as the heads on the pitch (see paintFaces in game.js), so the face on the scoreboard
         is literally the head you are kicking with. -->

    <!-- Card call-outs: who played what, under the scoreboard, one lane per player. -->
    <div class="callouts" id="callouts"></div>

    <div class="banner" id="banner"></div>

    <!-- The controls. Left = walk, right = act. The middle used to hold a hand of three
         cards; that system is archived (see archive/README.md) and the row is gone with it,
         markup included — a hidden row is still a row the layout editor can drag about. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <!-- HS's power-bar ramp (uploaded-images/WhatsApp Video 2026-09-26 16.05.36, sampled): red at the wing, green at the tip -->
      <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#e8321a"/><stop offset=".22" stop-color="#ea5a00"/><stop offset=".42" stop-color="#ef8a00"/>
        <stop offset=".6" stop-color="#ffc805"/><stop offset=".8" stop-color="#eefa04"/><stop offset="1" stop-color="#8ef808"/></linearGradient>
      <!-- HS's button glass, solved per row from the same plaque over two floors (M4: wood + pink): clear
           with a white sheen in the top third, then amber from ~38% down — the floor always shows through
           at ~40%, which is why the buttons take each stadium's colour -->
      <linearGradient id="hsGlass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".1" stop-color="#fff" stop-opacity=".25"/>
        <stop offset=".34" stop-color="#fff" stop-opacity=".15"/><stop offset=".38" stop-color="#c09a23" stop-opacity=".6"/>
        <stop offset=".55" stop-color="#ad7117" stop-opacity=".6"/><stop offset="1" stop-color="#a0660e" stop-opacity=".58"/></linearGradient>
      <!-- an arrow's shaft is near-clear (the floor shows through untouched); only its head carries the amber -->
      <linearGradient id="hsSheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".3" stop-color="#fff" stop-opacity=".18"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
      <!-- a held arrow lights up solid yellow (M3/M4: 255,227,0) -->
      <linearGradient id="hsLit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6a0"/><stop offset=".35" stop-color="#ffe300"/><stop offset="1" stop-color="#f2c200"/></linearGradient></defs></svg>
    <div class="pad" id="pad">
      <div class="pad-l">
        <button class="btn" data-k="left"><svg viewBox="0 0 300 100" aria-hidden="true"><path class="hs-shaft" d="M3 50 L140 3 L140 26 L297 26 L282 74 L140 74 L140 97 Z"/><path class="hs-head" d="M3 50 L140 3 L140 97 Z"/><path class="hs-line" d="M3 50 L140 3 L140 26 L297 26 L282 74 L140 74 L140 97 Z"/><text x="246" y="64">L</text></svg></button>
        <button class="btn" data-k="right"><svg viewBox="0 0 300 100" aria-hidden="true"><path class="hs-shaft" d="M18 26 L159 26 L159 3 L297 50 L159 97 L159 74 L3 74 Z"/><path class="hs-head" d="M159 3 L297 50 L159 97 Z"/><path class="hs-line" d="M18 26 L159 26 L159 3 L297 50 L159 97 L159 74 L3 74 Z"/><text x="50" y="64">R</text></svg></button>
      </div>
      <div class="pad-r">
        <!-- HS's order, left to right: POWER, KICK, JUMP — JUMP in the corner -->
        <button class="btn power" data-k="power" id="powerBtn"><svg viewBox="0 0 332 100" aria-hidden="true"><path class="hs-glass" d="M50 3 L331 3 L300 97 L50 97 A47 47 0 0 1 50 3 Z"/><text x="178" y="64">Power</text></svg></button>
        <button class="btn kick" data-k="kick"><svg viewBox="0 0 305 100" aria-hidden="true"><path class="hs-glass" d="M32 3 L304 3 L273 97 L1 97 Z"/><text x="152" y="64">Kick</text></svg></button>
        <button class="btn jump" data-k="jump"><svg viewBox="0 0 310 100" aria-hidden="true"><path class="hs-glass" d="M32 3 L262 3 A47 47 0 0 1 262 97 L1 97 Z"/><text x="150" y="64">Jump</text></svg></button>
      </div>
    </div>

    <!-- Edit mode: drag any button, pull its corner to resize, saved on this device.
         Same shape as football's controls editor — a DRAFT with a way back, because the
         first thing anyone does in a layout editor is drag something somewhere worse. -->
    <div class="editbar hidden" id="editBar">
      <span>גרור כפתור להזזה · משוך את הפינה לשינוי גודל</span>
      <label class="ce-slider">שקיפות
        <input type="range" id="editOpacity" min="0.2" max="1" step="0.05">
      </label>
      <button class="ghost" id="editReset">איפוס</button>
      <button class="ghost" id="editCancel">ביטול</button>
      <button class="play" id="editDone">שמירה</button>
    </div>

    <button class="gear" id="gear">⚙</button>
    <button class="sndBtn" id="sndBtn" title="צליל">🔊</button>
    <button class="pauseBtn" id="pauseBtn" aria-label="הפסקה">II</button>
  </div>

  <div class="over hidden" id="over">
    <div class="ov-res gold">RESULT</div>
    <div class="ov-spell gold" id="ovSpell"></div>
    <h2 id="overTitle"></h2>
    <div class="over-faces"><i class="ov-face" id="ovFace0"></i><p id="overScore"></p><i class="ov-face" id="ovFace1"></i></div>
    <p class="over-sub" id="overSub" hidden></p>
    <div class="over-btns">
      <button id="again">עוד פעם</button>
      <button id="back">קלפים</button>
    </div>
  </div>

  <!-- HS is landscape-only: a phone held upright is asked to turn -->
  <div class="rotate" id="rotate"><b>⟳</b><span>סובבו את הטלפון</span></div>

  <!-- HS's VS intro: both heads, a gold VS on a red streak, before KICK OFF -->
  <div class="vs hidden" id="vs" aria-hidden="true">
    <div class="vs-band"></div>
    <i class="vs-face" id="vsFace0"></i>
    <div class="vs-mid"><span class="vs-badge"><img src="img/saltiz.jpg" alt=""></span><b class="vs-txt gold">VS</b></div>
    <i class="vs-face" id="vsFace1"></i>
  </div>

  <!-- HS's pause: the gold II at the top right stops the match; resume, retry or quit -->
  <div class="over pause hidden" id="pause">
    <h2>הפסקה</h2>
    <div class="over-btns">
      <button id="resume">המשך</button>
      <button id="retry">מההתחלה</button>
      <button id="quit">יציאה</button>
    </div>
    <div class="over-btns"><button id="pSnd">🔊 צליל</button></div>
  </div>
</section>


<!-- ═══ TUNER ═══ live feel dials ════════════════════════════════════════ -->
<aside id="tuner" class="hidden">
  <header>כיוונון <button id="tunerClose">✕</button></header>
  <!-- The one row in here that is for PLAYERS rather than for tuning the feel, so it sits at
       the top and does not scroll away under sixty sliders. Same place football puts it. -->
  <button id="editCtlBtn" class="ctl-edit-row">🎛️ עריכת בקרות</button>
  <div id="tunerBody"></div>
  <footer><button id="tunerReset">אתחל</button><button id="tunerCopy">העתק JSON</button></footer>
</aside>

<script type="module" src="game.js"></script>
</body>
</html>

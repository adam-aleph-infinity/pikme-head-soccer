# Push to main → the tests run → Render redeploys https://pikme-headsoccer.onrender.com
#
# Render's own auto-deploy does NOT work for this service: it was created through the API
# against a repo URL, so Render never installed a webhook on the repo (`gh api repos/.../hooks`
# returns an empty list). `autoDeploy: yes` in the dashboard is therefore a promise nothing
# keeps. This workflow is the webhook.
#
# It deploys with a RENDER DEPLOY HOOK, not with a Render API key, and that is deliberate: a
# Render API key is scoped to the whole pikmeTV workspace and could restart pikme-server. A
# deploy hook can do exactly one thing — redeploy this one game. Anyone who can push here can
# already break the game, so the hook gives them nothing they did not have.
#
# Setup, once, by whoever owns the Render workspace:
#   Render dashboard → pikme-headsoccer → Settings → Deploy Hook → copy the URL
#   GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: RENDER_DEPLOY_HOOK      Value: that URL
# Until that secret exists the job passes and says so, so nothing here breaks in the meantime.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job level, not step level: the "did it come back up" step below tests `env.HOOK`, and a
    # step's own `env:` is not visible to another step's `if:`.
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - name: tests
        run: npm test

      # A red test suite still deploys nothing, because `npm test` above fails the job first.
      # That is the only gate on production here, and it is meant to be a low one: this is a
      # mock, and shipping a broken feel is allowed. Shipping a page that does not boot is not.
      - name: redeploy on Render
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set — tests passed but nothing was deployed."
            echo "Add it in Settings → Secrets and variables → Actions (see the comment in this file)."
            exit 0
          fi
          code=$(curl -s -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook -> HTTP $code"; cat /tmp/hook.out; echo
          [ "$code" = "200" ] || exit 1

      # Render takes 1-3 minutes to swap the instance, so this waits rather than asserting
      # immediately — an instant 200 would be the OLD build answering and would prove nothing.
      - name: wait for the new build to answer
        if: ${{ env.HOOK != '' }}
        run: |
          sleep 90
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://pikme-headsoccer.onrender.com/)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::the service never came back with 200 — roll back in the Render dashboard"
          exit 1

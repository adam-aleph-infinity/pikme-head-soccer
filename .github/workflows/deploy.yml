# Idan can ship this game using his own GitHub account. This service's deploy hook is the
# only hosting credential in the repo. Never replace it with a workspace-wide Render key.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish verifying one release before starting another. Cancelling an Action does not
# cancel a Render deploy that has already started.
concurrency:
  group: head-football-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy this commit and verify production
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: node scripts/deploy.mjs "$GITHUB_SHA"

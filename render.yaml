# Render Blueprint — the head-soccer game + online 1v1 server.
# Render supplies PORT and TLS; the client connects over wss:// automatically.
services:
  - type: web
    name: pikme-headsoccer
    env: node
    # PAID, not free, and deliberately so: a free instance sleeps after 15 minutes idle and
    # takes 30-50s to wake. The entire feature is "send a friend a link" — a link that spins
    # for most a minute before the lobby appears is not a shareable game. Approved by Adam
    # 2026-08-21.
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    # GitHub Actions tests, deploys an exact SHA, and verifies /version.
    autoDeployTrigger: off
    # THE LEAGUE'S FILE (server/store.js): league.sqlite — trophies, teams, play stats. Without a disk
    # every deploy wiped it. Added 2026-10-15 (Adam; ~$0.25/month). A service with a disk restarts
    # on deploy instead of zero-downtime (a few seconds offline).
    disk:
      name: league
      mountPath: /var/data
      sizeGB: 1
    # BUG REPORTS (server/feedback.js): the anonymous Google Form the Options button sends to.
    # Set in Render's dashboard; until the first three are there the button stays hidden.
    envVars:
      - key: FEEDBACK_FORM_ID
        sync: false
      - key: FEEDBACK_ENTRY_KIND
        sync: false
      - key: FEEDBACK_ENTRY_TEXT
        sync: false
      - key: FEEDBACK_ENTRY_VERSION
        sync: false
      # Where league.sqlite lives: the disk above.
      - key: DATA_DIR
        value: /var/data
